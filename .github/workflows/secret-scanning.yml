name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Uses the open-source gitleaks BINARY rather than gitleaks-action@v2, which
      # requires a paid GITLEAKS_LICENSE for organization-owned repos. The binary
      # is pinned and checksum-verified. Scans the checked-out working tree (the
      # content this PR would merge) against .gitleaks.toml.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry the downloads. A bare `curl -f` turns any transient 5xx from the
          # release CDN into exit 22, and `set -e` then kills the job before the
          # scanner ever runs — which is how this gate sat red, and therefore never
          # scanned anything, while the repo looked "checked". A download blip must
          # not read as a security result.
          curl_get() {
            curl -sSLf --retry 5 --retry-delay 2 --retry-all-errors "$1" -o "$2"
          }
          curl_get "${base}/${tarball}" "${tarball}"
          curl_get "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" checksums.txt
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
